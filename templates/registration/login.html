{% extends 'base.html' %}

{% block title %}
Вход
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="mb-4">
                    Вход
                </h2>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit"
                            class="btn btn-dark w-100">
                        Войти
                    </button>

                </form>

            </div>

        </div>

    </div>
</div>

{% endblock %}
